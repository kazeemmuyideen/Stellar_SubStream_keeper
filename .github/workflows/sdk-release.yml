name: SDK release

on:
  push:
    tags:
      - "sdk-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Verify and publish @substream/sdk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: substream
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: substream/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build SDK
        run: npm run build -w @substream/sdk

      - name: Test SDK
        run: npm test -w @substream/sdk

      - name: Check release metadata
        run: npm run sdk:check-release
        env:
          SDK_RELEASE_TAG: ${{ github.ref_name }}

      - name: Publish to npm
        run: npm publish -w @substream/sdk --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
