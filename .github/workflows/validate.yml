name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  skills-and-manifests:
    name: Skills, manifests, and secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Validate skills and plugin manifests
        run: node scripts/validate_skills.mjs

      - name: Scan tracked files for secrets
        run: ./scripts/check_secrets.sh

  substream-contract:
    name: SubStream contract (fmt, clippy, tests, wasm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: substream
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Install Stellar CLI
        run: |
          curl -fsSL -o /tmp/stellar-cli.tar.gz \
            https://github.com/stellar/stellar-cli/releases/download/v30.0.1/stellar-cli-30.0.1-x86_64-unknown-linux-gnu.tar.gz
          echo "48c70074020e09af0a3ebbd2bf62d53c9aec47935e49a112d3cd90fb4e37658f  /tmp/stellar-cli.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.cargo/bin"
          tar xzf /tmp/stellar-cli.tar.gz -C "$HOME/.cargo/bin"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/stellar" --version

      - name: Build WASM
        run: stellar contract build

  substream-typescript:
    name: SubStream SDK, dApp, keeper, and indexer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: substream
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: substream/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build dApp
        run: npm run build
