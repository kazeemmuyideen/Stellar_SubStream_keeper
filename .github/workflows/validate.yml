name: Validate

on:
  push:
  pull_request:

jobs:
  skills-and-manifests:
    name: Validate skills and plugin manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run validator
        run: node scripts/validate_skills.mjs
