name: Publish container images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Build and push ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - keeper
          - indexer
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve image version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=manual-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build image
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          docker build \
            --file "services/${{ matrix.service }}/Dockerfile" \
            --tag "ghcr.io/${repository}/substream-${{ matrix.service }}:${{ steps.version.outputs.value }}" \
            --tag "ghcr.io/${repository}/substream-${{ matrix.service }}:latest" \
            substream

      - name: Push image
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          docker push "ghcr.io/${repository}/substream-${{ matrix.service }}:${{ steps.version.outputs.value }}"
          docker push "ghcr.io/${repository}/substream-${{ matrix.service }}:latest"
