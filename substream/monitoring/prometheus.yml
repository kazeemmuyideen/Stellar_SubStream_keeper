global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: substream-keeper
    scrape_interval: 10s
    static_configs:
      - targets: ["keeper:8788"]
        labels:
          service: substream-keeper
          network: testnet
